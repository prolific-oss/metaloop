# MetaLoop Study 2: Self-Review (T6 blind spot)
# Two-phase: answer all questions first, then review your own answers.

study:
  title: "Knowledge Quiz with Self-Review"
  subtitle: "Two phases: answer questions, then review your answers"
  logo_text: "M"
  guidelines: ""

phase_guidelines:
  1: |
    **Phase 1 of 2 — Answer the questions**

    Answer each question and rate your confidence. Do not look anything up.
    After you've answered all 8, you'll review your answers in Phase 2.
  2: |
    **Phase 2 of 2 — Review your answers**

    You'll now see each question again along with the answer you gave.
    Decide whether to stick with your answer or change it.

allocation:
  scenarios_per_participant: 16
  target_ratings_per_scenario: 50
  slot_timeout_minutes: 20

questions:
  - id: answer
    type: rating
    phase: 1
    label: "Your answer"
    required: true
    options:
      A: "A"
      B: "B"
      C: "C"
      D: "D"
    colors:
      A: "#4f46e5"
      B: "#4f46e5"
      C: "#4f46e5"
      D: "#4f46e5"

  - id: confidence
    type: slider
    phase: 1
    label: "How confident are you?"
    required: true
    min: 0
    max: 100
    step: 1
    default: 50
    labels:
      left: "Guessing"
      right: "Certain"

  - id: review_verdict
    type: rating
    phase: 2
    label: "Do you want to change your answer?"
    required: true
    options:
      keep: "No — sticking with my answer"
      change: "Yes — I want to change it"
    colors:
      keep: "#16a34a"
      change: "#ea580c"

  - id: revised_answer
    type: rating
    phase: 2
    label: "Your new answer"
    required: false
    options:
      A: "A"
      B: "B"
      C: "C"
      D: "D"
    colors:
      A: "#4f46e5"
      B: "#4f46e5"
      C: "#4f46e5"
      D: "#4f46e5"
