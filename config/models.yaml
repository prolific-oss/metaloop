# MetaLoop shared model configuration (v2, October 2026 rerun).
#
# A shared inference policy applied consistently across tasks, with explicit
# model-specific capability exceptions. It is not equivalent inference compute
# across models: "medium" reasoning means different budgets or levels per
# provider, and adaptive thinking may use none on easy items.
# Anthropic, OpenAI and Google models are called through their own APIs;
# the rest go through OpenRouter with the provider pinned (no fallbacks).
# Every results file records this file's hash, the provider that served each
# response, and the model version it reports.
#
# Policy
# - temperature: 1.0 sent explicitly wherever accepted (Google recommends 1.0
#   for Gemini 3); omitted for GPT-5.4, which accepts only its default.
# - reasoning: on, at effort "medium", for every model that supports it;
#   models without reasoning (GPT-4.1, Mistral Large 2512) run without it.
#   Per API: Anthropic 4.6 adaptive thinking with effort "medium"; Sonnet 4
#   (OpenRouter) "medium" = 50% of max_tokens (8,192); OpenAI
#   reasoning_effort "medium"; Gemini 3.1 thinkingLevel "medium"; Gemini 2.5
#   thinkingBudget 8,192 (the same 50% share); OpenRouter models effort "medium".
# - max_tokens: 16,384 for every call, provisional until the pilot (every
#   model x task, longest contexts) has been checked for finish reasons,
#   reasoning/output usage and empty outputs.
# - provider: first-party where one exists; for open-weight models, a host
#   serving native precision (DeepSeek V3.2: fp8, its native weight format).
#   Gemma 4 is served first-party by the Gemini API.
#
# Judges (answer re-extraction, Strategy-Switching scoring) are measurement
# tools and keep their own settings (see judges: below).

defaults:
  route: openrouter                   # overridden per model below
  temperature: 1.0
  max_tokens: 16384
  reasoning: {effort: medium}
  allow_fallbacks: false
  timeout_s: 900                     # long reasoning on hard items (e.g. Opus on Cipher) exceeded 300 s
  retries: 4

models:
  sonnet-4:
    id: anthropic/claude-sonnet-4
    provider: amazon-bedrock          # Anthropic's direct API no longer serves it
  sonnet-4.6:
    route: anthropic
    id: claude-sonnet-4-6
    reasoning: {thinking: adaptive, effort: medium}
  opus-4.6:
    route: anthropic
    id: claude-opus-4-6
    reasoning: {thinking: adaptive, effort: medium}
  gpt-4.1:
    route: openai
    id: gpt-4.1-2025-04-14            # dated snapshot, as served 2026-10-12
    reasoning: none                   # not a reasoning model
  gpt-5.4:
    route: openai
    id: gpt-5.4-2026-03-05            # dated snapshot, as served 2026-10-12
    reasoning: {reasoning_effort: medium}
    temperature: omit                 # only the default is accepted
  gemini-2.5-pro:
    route: google
    id: gemini-2.5-pro
    reasoning: {thinkingBudget: 8192}
    note: "OpenRouter lists expiry 2026-10-20; run first"
  gemini-3.1-pro:
    route: google
    id: gemini-3.1-pro-preview
    reasoning: {thinkingLevel: medium}
  gemma-4-31b:
    route: google
    id: gemma-4-31b-it
    reasoning: {thinking: default}    # always thinks on the Gemini API; level and budget are rejected (400)
    note: "OpenRouter's bf16 host (Crusoe) was rate-limited on the shared pool on 2026-10-12"
    retries: 40                      # 2026-10-16: Gemini API quota returns 429 for minutes at a time; with 4 retries every Loop session failed (13 and 16 Oct); 2026-10-17: late Loop turns are ~18k input tokens against a 16k/min quota, all six sessions failed again with 10 retries
  gemma-4-31b-crusoe:               # Loop only (2026-10-19): the Gemini API's 16k input-token/min quota rejects late Loop turns (~18k tokens) outright
    cohort: route-variant
    id: google/gemma-4-31b-it
    provider: crusoe/bf16            # native-precision host on OpenRouter, no fallbacks
    items_from: gemma-4-31b          # same Loop items as the Google-route Self-Review run
    retries: 12                      # Crusoe returns upstream 429s under load (2026-10-19)
  deepseek-v3.2:
    id: deepseek/deepseek-v3.2
    provider: google-vertex          # 2026-10-12: gmicloud/fp8 started returning "model deprecated" mid-run; restarted from scratch here
    retries: 10                      # 2026-10-14: Vertex's shared pool returns 429 for minutes at a time; 4 retries (75 s) lost Loop sessions
  mistral-large:
    id: mistralai/mistral-large-2512
    provider: mistral/eu              # default endpoint rate-limited in Oct 2026
    reasoning: none                   # not a reasoning model
  # Replacements for the accepted paper's Qwen3 235B and Grok 4.1 Fast, both retired in Oct 2026
  qwen-3.8-max:
    cohort: extension
    id: qwen/qwen3.8-max-0902
    provider: alibaba                 # first-party
  grok-4.7:
    cohort: extension
    id: x-ai/grok-4.7
    provider: xai                     # first-party

retired:                              # not rerun; newer versions to be added later
  - qwen/qwen3-235b-a22b              # removed from OpenRouter 2026-10-09
  - x-ai/grok-4.1-fast                # no longer listed

# Verified 2026-10-12 with one call each: OpenRouter pins served by the named
# provider; direct Anthropic, OpenAI and Google calls succeed with these settings.
# reasoning: none -> not sent (model has no reasoning mode). temperature: omit -> not sent.

judges:
  # Same settings as the judge passes already run (Sep-Oct 2026), so cached and
  # new verdicts are comparable. As sent: temperature 0, max_tokens 2000, no
  # reasoning parameter; OpenRouter drops temperature for GPT-5.4, which then
  # reasons at its default effort.
  answer_reextraction: [anthropic/claude-sonnet-4.6, openai/gpt-5.4, google/gemini-3.1-pro-preview]
  strategy_switching: anthropic/claude-opus-4.6
  settings: {temperature: 0, max_tokens: 2000}
